name: Tests

# Unit tests of the application code. No GCP access: nothing here touches the cloud
# (the frontend's Firestore smoke test only runs with FIRESTORE_SMOKE=1, never set here).
on:
  pull_request:
    branches: [dev, main]
    paths: ["app/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (${{ matrix.function }})
    # GitHub-hosted: -race needs a C compiler, which our runner image does not ship
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        function: [admin_cmd, draw_pixel, get_pixel, proxy]
    defaults:
      run:
        working-directory: app/functions/${{ matrix.function }}
    steps:
      - uses: actions/checkout@v4

      # each function is its own Go module, with its own Go version
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/functions/${{ matrix.function }}/go.mod
          cache-dependency-path: app/functions/${{ matrix.function }}/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
