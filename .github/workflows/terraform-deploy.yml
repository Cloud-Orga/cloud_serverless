name: Terraform Deploy

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  # un tag ne déploie que s'il pointe un commit de main : un tag posé sur une autre branche est refusé
  verify-main:
    name: tag on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main: no deployment"
            exit 1
          fi

  # A release deploys prd only, after the approval of the prd environment's reviewers.
  # The dev environment is the team's sandbox: it is applied by hand and never touched by a release,
  # so a release cannot overwrite work being tested there.
  deploy-prd:
    name: ${{ matrix.stack }} (prd)
    needs: verify-main
    runs-on: ubuntu-latest
    environment: prd
    # one stack at a time, in this order: the cluster, then the runners on it, then the application, then the site
    # (access is not here: it holds the deployer's own rights, applied by hand)
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        stack: [foundation, runners, serverless, frontend]
    concurrency:
      group: terraform-prd
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: hashicorp/setup-terraform@v3

      - name: Init
        run: terraform init -input=false -backend-config=backends/prd.hcl

      - name: Plan
        run: terraform plan -input=false -var-file=prd.tfvars -out=tfplan

      # applies exactly the plan printed above
      - name: Apply
        run: terraform apply -input=false tfplan

  # the site image is built with the addresses of the gateway and of the front: it goes after the prd stacks
  site-prd:
    name: site (prd)
    needs: deploy-prd
    uses: ./.github/workflows/deploy-site.yml
    with:
      env: prd
