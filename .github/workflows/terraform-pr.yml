name: Terraform PR

# PRs into dev plan the dev sandbox: informative only, not a required check, so a red run does not block the merge.
# Release PRs into main plan prd: they show what the release will change there, and are required to pass.
on:
  pull_request:
    branches: [dev, main]
    paths: ["infra/**", ".github/workflows/terraform-pr.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  # the environment this PR is checked against: prd for a release PR into main, dev otherwise
  TARGET: ${{ github.base_ref == 'main' && 'prd' || 'dev' }}

jobs:
  terraform:
    name: ${{ matrix.stack }} (${{ github.base_ref == 'main' && 'prd' || 'dev' }})
    # switch: set RUNNER_DEV / RUNNER_PRD (repository variables) to a scale set name to use our runners
    runs-on: ${{ (github.base_ref == 'main' && (vars.RUNNER_PRD || 'ubuntu-latest')) || vars.RUNNER_DEV || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        stack: [access, foundation, runners, serverless, frontend]
    # gives the job the environment's variables (WIF_PROVIDER, DEPLOYER_SA)
    # prd plans use prd-plan (prd's variables, no required reviewers): a plan changes nothing,
    # so only real prd deployments wait for approval
    environment: ${{ github.base_ref == 'main' && 'prd-plan' || 'dev' }}
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          # the wrapper needs node in the PATH, which our runner image may not provide
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -diff

      - name: Init
        run: terraform init -input=false -backend-config=backends/${{ env.TARGET }}.hcl

      - name: Validate
        run: terraform validate

      # -lock=false : un plan en PR ne modifie rien, il ne doit pas bloquer un apply en cours
      - name: Plan
        run: terraform plan -input=false -lock=false -var-file=${{ env.TARGET }}.tfvars
